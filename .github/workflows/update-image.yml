name: Update Edit Banana Image

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no upstream change"
        required: false
        default: false
        type: boolean
      target_version:
        description: "Target upstream commit SHA. Leave empty for latest default-branch commit."
        required: false
        default: ""
        type: string
      publish_to_store:
        description: "Publish to LazyCat App Store"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

env:
  UPSTREAM_REPO: BIT-DataLab/Edit-Banana
  PROJECT_NAME: Edit Banana
  PROJECT_NAME_LOWER: edit-banana

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest upstream commit
        id: get-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="${{ inputs.target_version }}"

          if [ -n "$TARGET_SHA" ]; then
            LATEST_SHA="$TARGET_SHA"
          else
            DEFAULT_BRANCH=$(gh api "repos/${{ env.UPSTREAM_REPO }}" --jq '.default_branch')
            LATEST_SHA=$(gh api "repos/${{ env.UPSTREAM_REPO }}/commits/${DEFAULT_BRANCH}" --jq '.sha')
          fi

          COMMIT_DATE=$(gh api "repos/${{ env.UPSTREAM_REPO }}/commits/${LATEST_SHA}" --jq '.commit.committer.date')
          DATE_PART=$(date -u -d "$COMMIT_DATE" +%Y%m%d)
          TIME_PART=$(date -u -d "$COMMIT_DATE" +%H%M%S | sed 's/^0*//')
          if [ -z "$TIME_PART" ]; then
            TIME_PART=0
          fi

          SHORT_SHA=$(printf '%s' "$LATEST_SHA" | cut -c1-12)
          LATEST_VERSION="0.${DATE_PART}.${TIME_PART}"

          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "Build from upstream commit ${LATEST_SHA}"
            echo
            echo "Commit date: ${COMMIT_DATE}"
            echo "Derived package version: ${LATEST_VERSION}"
          } > /tmp/release_notes.txt

      - name: Check if update needed
        id: check-update
        run: |
          CURRENT_REF=$(sed -n 's/^ARG UPSTREAM_REF=//p' Dockerfile | head -1)
          CURRENT_IMAGE=$(grep 'image:' lzc-manifest.yml | head -1 | awk '{print $2}')
          LATEST_SHA="${{ steps.get-version.outputs.latest_sha }}"
          SHORT_SHA="${{ steps.get-version.outputs.short_sha }}"

          echo "Current Dockerfile ref: $CURRENT_REF"
          echo "Current image: $CURRENT_IMAGE"

          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.target_version }}" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_REF" != "$LATEST_SHA" ] || [[ "$CURRENT_IMAGE" != *"$SHORT_SHA"* ]]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check-update.outputs.update_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lzc-cli
        if: steps.check-update.outputs.update_needed == 'true'
        run: npm install -g @lazycatcloud/lzc-cli

      - name: Login to GHCR
        if: steps.check-update.outputs.update_needed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check-update.outputs.update_needed == 'true'
        id: build-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LZC_CLI_TOKEN: ${{ secrets.LZC_CLI_TOKEN }}
        run: |
          LATEST_SHA="${{ steps.get-version.outputs.latest_sha }}"
          SHORT_SHA="${{ steps.get-version.outputs.short_sha }}"
          LOCAL_IMAGE="ghcr.io/${{ github.repository }}:${SHORT_SHA}"
          LOCAL_IMAGE=$(echo "$LOCAL_IMAGE" | tr '[:upper:]' '[:lower:]')

          docker build \
            --build-arg UPSTREAM_REPO=${{ env.UPSTREAM_REPO }} \
            --build-arg UPSTREAM_REF="$LATEST_SHA" \
            -t "$LOCAL_IMAGE" .

          docker push "$LOCAL_IMAGE"

          COPY_OUTPUT=$(lzc-cli appstore copy-image "$LOCAL_IMAGE" 2>&1)
          echo "$COPY_OUTPUT"
          ACCELERATED_URL=$(echo "$COPY_OUTPUT" | grep -oE 'registry\.lazycat\.cloud/[a-zA-Z0-9_/.:-]+' | head -1 || true)

          if [ -z "$ACCELERATED_URL" ]; then
            echo "Failed to obtain LazyCat registry image"
            exit 1
          fi

          echo "accelerated_url=$ACCELERATED_URL" >> "$GITHUB_OUTPUT"

      - name: Update manifest and Dockerfile
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          LATEST_SHA="${{ steps.get-version.outputs.latest_sha }}"
          LATEST_VERSION="${{ steps.get-version.outputs.latest_version }}"
          ACCELERATED_URL="${{ steps.build-image.outputs.accelerated_url }}"

          sed -i "s|^ARG UPSTREAM_REF=.*|ARG UPSTREAM_REF=${LATEST_SHA}|g" Dockerfile
          sed -i "s|^version:.*|version: ${LATEST_VERSION}|g" lzc-manifest.yml
          sed -i "s|image: .*|image: ${ACCELERATED_URL}|g" lzc-manifest.yml

      - name: Build package
        if: steps.check-update.outputs.update_needed == 'true'
        env:
          LZC_CLI_TOKEN: ${{ secrets.LZC_CLI_TOKEN }}
        run: |
          lzc-cli project build -o ${PROJECT_NAME_LOWER}.lpk

      - name: Publish to LazyCat App Store
        if: steps.check-update.outputs.update_needed == 'true' && inputs.publish_to_store == true
        env:
          LZC_CLI_TOKEN: ${{ secrets.LZC_CLI_TOKEN }}
        run: |
          lzc-cli appstore publish ${PROJECT_NAME_LOWER}.lpk --clang en -c "Auto update to upstream commit ${{ steps.get-version.outputs.latest_sha }}"

      - name: Create GitHub Release
        if: steps.check-update.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.get-version.outputs.latest_version }}"
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          gh release create "$TAG_NAME" \
            --title "${{ env.PROJECT_NAME }} $TAG_NAME" \
            --notes-file /tmp/release_notes.txt \
            ${PROJECT_NAME_LOWER}.lpk

      - name: Commit and push changes
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Dockerfile lzc-manifest.yml

          if git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "Update Edit Banana to ${{ steps.get-version.outputs.latest_sha }}"
          git push
